name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  self-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # metric-compatible fonts used by the font normalisation (Arial metrics + CJK)
      - run: sudo apt-get install -y --no-install-recommends fonts-liberation fonts-wqy-zenhei
      - run: npm test
      - name: demo (report only)
        run: npm run demo
